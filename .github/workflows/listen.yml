name: Unix socket handoffs

on:
  push:
    paths:
      - "extensions/listen/**"
      - "skills/pi-listen/**"
      - "tests/pi-compatibility.test.ts"
      - "package*.json"
      - ".github/workflows/listen.yml"
  pull_request:
    paths:
      - "extensions/listen/**"
      - "skills/pi-listen/**"
      - "tests/pi-compatibility.test.ts"
      - "package*.json"
      - ".github/workflows/listen.yml"

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx vitest run extensions/listen tests/pi-compatibility.test.ts
